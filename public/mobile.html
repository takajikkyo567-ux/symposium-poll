<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>シンポジウム - スマホ投票画面</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { 
            background-color: #0a0a0a; 
            color: #ffffff; 
            font-family: sans-serif; 
            margin: 0; 
            padding: 20px; 
            text-align: center; 
        }
        h1 { 
            color: #ffff00; 
            font-size: 1.8em; 
            margin-bottom: 30px; 
        }
        .status-msg { 
            font-weight: bold; 
            margin-bottom: 20px; 
            font-size: 1.2em; 
        }
        .option-btn {
            display: block; 
            width: 100%; 
            background: #222; 
            color: #fff; 
            border: 2px solid #444;
            padding: 18px; 
            margin: 15px 0; 
            font-size: 1.3em; 
            font-weight: bold;
            border-radius: 10px; 
            cursor: pointer;
            transition: all 0.2s;
        }
        .option-btn:active { 
            background: #00ffaa; 
            color: #000; 
            border-color: #00ffaa; 
            transform: scale(0.95); 
        }
        .voted-msg { 
            color: #00ffaa; 
            font-weight: bold; 
            display: none; 
            margin-top: 30px; 
            font-size: 1.5em; 
        }
    </style>
</head>
<body>
    <div id="statusMsg" class="status-msg" style="color: #ff0055;">投票の開始をお待ちください...</div>
    <h1 id="qText">質問を読み込み中...</h1>
    
    <div id="optionsArea"></div>
    <div id="votedMsg" class="voted-msg">✅ 投票を受け付けました！</div>

    <script>
        const socket = io();
        let currentQuestionIndex = -1;
        let isAccepting = false;
        let hasVoted = false;

        socket.on('stateUpdate', (data) => {
            // 質問が変わったら「投票済み」状態をリセットしてボタンを再表示
            if (currentQuestionIndex !== data.questionIndex) {
                currentQuestionIndex = data.questionIndex;
                hasVoted = false;
                document.getElementById('votedMsg').style.display = 'none';
                document.getElementById('optionsArea').style.display = 'block';
            }
            
            isAccepting = data.isAcceptingVotes;
            
            // プロジェクター側で「質問を発出」が押されたかどうかの表示
            const statusEl = document.getElementById('statusMsg');
            if (isAccepting) {
                statusEl.innerText = "現在投票受付中です！";
                statusEl.style.color = "#00ffaa";
            } else {
                statusEl.innerText = "投票は締め切られました（または開始前です）";
                statusEl.style.color = "#ff0055";
            }

            document.getElementById('qText').innerText = data.question.text;
            
            // 選択肢ボタンの生成
            const area = document.getElementById('optionsArea');
            area.innerHTML = '';
            
            data.question.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => {
                    if (!isAccepting) {
                        alert("現在は投票を受け付けていません。プロジェクター画面の開始をお待ちください。");
                        return;
                    }
                    if (hasVoted) {
                        alert("すでに投票済みです。");
                        return;
                    }
                    
                    // 【重要】server.jsが要求している正しい合図（submitVote）で票を送る
                    socket.emit('submitVote', idx);
                    
                    hasVoted = true;
                    area.style.display = 'none';
                    document.getElementById('votedMsg').style.display = 'block';
                };
                area.appendChild(btn);
            });
        });
    </script>
</body>
</html>
