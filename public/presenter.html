<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>シンポジウム - プロジェクター画面</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { background-color: #0a0a0a; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .controls { background: #222; padding: 20px; border-radius: 10px; display: inline-block; border: 1px solid #444; }
        button { font-size: 1.2em; padding: 12px 24px; margin: 5px; cursor: pointer; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="controls">
        <button id="btnPrev">◀ 前</button>
        <span id="qNum" style="margin:0 20px;">Q 1/8</span>
        <button id="btnNext">次 ▶</button>
        <button id="btnStart" style="background:#00ffaa">▶ 質問を発出</button>
        <button id="btnDrum" style="background:#aa00ff; color:#fff">🥁 ドラムロール</button>
        <button id="btnEnd" style="background:#ff0055; color:#fff">■ 締め切り（笛）</button>
    </div>
    <h1 id="qText" style="color:#ffff00; font-size:3em;">読み込み中...</h1>
    
    <script>
        const socket = io();
        const ctx = new (window.AudioContext || window.webkitAudioContext)();

        // 1. 質問発出音：重厚な「ジャジャン！」
        function playStartSound() {
            [130.81, 164.81, 196.00].forEach((freq, i) => {
                const osc = ctx.createOscillator(); const gain = ctx.createGain();
                osc.type = 'sawtooth'; osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.1);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.1 + 1.2);
                osc.connect(gain); gain.connect(ctx.destination);
                osc.start(ctx.currentTime + i * 0.1); osc.stop(ctx.currentTime + i * 0.1 + 1.2);
            });
        }

        // 2. 締め切り笛音：運動会の長いホイッスル
        function playWhistle() {
            const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.type = 'triangle'; osc.frequency.value = 2700;
            gain.gain.setValueAtTime(0, ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.1);
            gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 1.5);
            gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 2.0);
            osc.connect(gain); gain.connect(ctx.destination);
            osc.start(); osc.stop(ctx.currentTime + 2.0);
        }

        // 3. ドラムロール：本格的なスネア連打（擬似ノイズ）
        let drumInterval = null;
        function toggleDrum(btn) {
            if (!drumInterval) {
                drumInterval = setInterval(() => {
                    const osc = ctx.createOscillator(); const gain = ctx.createGain();
                    osc.type = 'square'; osc.frequency.value = 120 + Math.random() * 20;
                    gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.start(); osc.stop(ctx.currentTime + 0.08);
                }, 60);
                btn.innerText = '🥁 ドラム停止';
            } else {
                clearInterval(drumInterval); drumInterval = null;
                btn.innerText = '🥁 ドラムロール';
            }
        }

        socket.on('stateUpdate', d => {
            document.getElementById('qText').innerText = d.question.text;
            document.getElementById('qNum').innerText = `Q ${d.questionIndex + 1}/8`;
        });
        document.getElementById('btnStart').onclick = () => { playStartSound(); socket.emit('adminStartVoting'); };
        document.getElementById('btnEnd').onclick = () => { playWhistle(); socket.emit('adminCloseVoting'); };
        document.getElementById('btnDrum').onclick = function() { toggleDrum(this); };
        document.getElementById('btnNext').onclick = () => socket.emit('adminChangeQuestion', 1);
        document.getElementById('btnPrev').onclick = () => socket.emit('adminChangeQuestion', -1);
    </script>
</body>
</html>
