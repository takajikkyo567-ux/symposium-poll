<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>プレゼンター</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: sans-serif; text-align: center; }
        .panel { background: #222; padding: 20px; border-radius: 10px; display: inline-block; }
        button { font-size: 1.5em; padding: 15px 30px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="panel">
        <button id="prev">◀ 前</button>
        <span id="qNum">Q</span>
        <button id="next">次 ▶</button>
        <button id="start" style="background:#00ffaa">開始</button>
        <button id="end" style="background:#ff0055; color:#fff">終了</button>
    </div>
    <h1 id="qText">読み込み中...</h1>
    <script>
        const socket = io();
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playSound(type) {
            const osc = audioCtx.createOscillator();
            osc.connect(audioCtx.destination);
            osc.frequency.value = type === 'start' ? 880 : 220;
            osc.start(); osc.stop(audioCtx.currentTime + 0.5);
        }

        socket.on('stateUpdate', d => {
            document.getElementById('qText').innerText = d.question.text;
            document.getElementById('qNum').innerText = `Q ${d.questionIndex + 1}/8`;
        });

        document.getElementById('start').onclick = () => { playSound('start'); socket.emit('adminStartVoting'); };
        document.getElementById('end').onclick = () => { playSound('end'); socket.emit('adminCloseVoting'); };
        document.getElementById('next').onclick = () => socket.emit('adminChangeQuestion', 1);
        document.getElementById('prev').onclick = () => socket.emit('adminChangeQuestion', -1);
    </script>
</body>
</html>
