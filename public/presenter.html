<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>シンポジウム - プロジェクター画面</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { background-color: #0a0a0a; color: #ffffff; font-family: sans-serif; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .controls { background: #222; padding: 20px; border-radius: 10px; margin-bottom: 30px; border: 1px solid #444; }
        button { font-size: 1.2em; padding: 12px 24px; margin: 5px; cursor: pointer; border-radius: 8px; font-weight: bold; }
        #qrModal { display: none; position: fixed; top:0; left:0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 999; flex-direction: column; align-items: center; justify-content: center; }
        .qr-box { background: #fff; padding: 40px; border-radius: 20px; color: #000; text-align: center; }
        
        /* グラフ表示用のスタイル */
        .main-container { width: 90%; max-width: 1200px; padding: 20px; text-align: center; }
        .bar-container { margin-bottom: 25px; text-align: left; }
        .bar-label-area { display: flex; justify-content: space-between; font-size: 1.8em; margin-bottom: 10px; font-weight: bold; color: #fff; }
        .bar-bg { background-color: #222; border-radius: 10px; width: 100%; height: 50px; overflow: hidden; border: 1px solid #444; }
        .bar-fill { background-color: #ffff00; height: 100%; width: 0%; transition: width 0.6s cubic-bezier(0.22, 1, 0.36, 1); }
        .vote-count { color: #00ffaa; }
    </style>
</head>
<body>
    <div id="qrModal" onclick="this.style.display='none'"><div class="qr-box"><h2>スマホで参加</h2><div id="qrcode"></div></div></div>
    
    <div class="controls">
        <button id="btnPrev">◀ 前</button>
        <span id="qNum" style="margin:0 20px; font-size: 1.5em; font-weight: bold;">Q 1/8</span>
        <button id="btnNext">次 ▶</button>
        <button id="btnStart" style="background:#00ffaa; color:#000;">▶ 質問を発出</button>
        <button id="btnDrum" style="background:#aa00ff; color:#fff">🥁 ドラムロール</button>
        <button id="btnEnd" style="background:#ff0055; color:#fff">■ 締め切り（笛）</button>
        <button onclick="document.getElementById('qrModal').style.display='flex'">📱 QR表示</button>
    </div>
    
    <div class="main-container">
        <h1 id="qText" style="color:#ffff00; font-size:3em; margin-bottom: 40px;">質問を読み込み中...</h1>
        <!-- 回答のグラフが反映されるエリア -->
        <div id="resultsArea"></div>
    </div>

    <script>
        const socket = io();
        new QRCode(document.getElementById("qrcode"), window.location.origin + '/mobile.html');
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        
        // 1. 質問発出音
        function playStartSound() {
            [130.81, 164.81, 196.00, 261.63].forEach((f, i) => {
                const o = ctx.createOscillator(); const g = ctx.createGain();
                o.type = 'sawtooth'; o.frequency.value = f;
                g.gain.setValueAtTime(0.2, ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
                o.connect(g); g.connect(ctx.destination);
                o.start(ctx.currentTime + i*0.05); o.stop(ctx.currentTime + 1.2);
            });
        }
        
        // 2. 締め切り笛音
        function playWhistle() {
            const o1 = ctx.createOscillator(); const o2 = ctx.createOscillator(); const g = ctx.createGain();
            o1.type = 'triangle'; o2.type = 'triangle';
            o1.frequency.value = 2700; o2.frequency.value = 2750;
            g.gain.setValueAtTime(0, ctx.currentTime);
            g.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.1);
            g.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 1.5);
            g.gain.linearRampToValueAtTime(0, ctx.currentTime + 2.0);
            o1.connect(g); o2.connect(g); g.connect(ctx.destination);
            o1.start(); o2.start(); o1.stop(ctx.currentTime + 2.0); o2.stop(ctx.currentTime + 2.0);
        }

        // 3. ドラムロール
        let drumInterval = null;
        function toggleDrum(btn) {
            if (!drumInterval) {
                drumInterval = setInterval(() => {
                    const o = ctx.createOscillator(); const g = ctx.createGain();
                    o.type = 'sawtooth'; o.frequency.value = 150 + Math.random() * 50;
                    g.gain.setValueAtTime(0.2, ctx.currentTime);
                    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
                    o.connect(g); g.connect(ctx.destination);
                    o.start(); o.stop(ctx.currentTime + 0.08);
                }, 60);
                btn.innerText = '🥁 ドラム停止';
            } else {
                clearInterval(drumInterval); drumInterval = null;
                btn.innerText = '🥁 ドラムロール';
            }
        }

        // 質問と票のデータを記憶しておく
        let currentQuestion = null;
        let currentIndex = 0;
        let currentVotes = [];

        // 画面を更新する処理
        function updateScreen(d) {
            if (!d) return;

            // ① 質問データの更新
            if (d.question) {
                currentQuestion = d.question;
            } else if (d.text && d.options) {
                currentQuestion = d;
            }
            if (d.questionIndex !== undefined) {
                currentIndex = d.questionIndex;
            }

            // ② 票データの総当たりチェック（あらゆるパターンを予測）
            if (d.votes) {
                currentVotes = d.votes;
            } else if (d.counts) {
                currentVotes = d.counts;
            } else if (d.voteCounts) {
                currentVotes = d.voteCounts;
            } else if (d.results) {
                currentVotes = d.results;
            } else if (currentQuestion && currentQuestion.votes) {
                currentVotes = currentQuestion.votes;
            } else if (d.question && d.question.votes) {
                currentVotes = d.question.votes;
            } else if (Array.isArray(d)) {
                currentVotes = d;
            }

            // まだ質問が一度も来ていなければ表示をスキップ
            if (!currentQuestion) return;

            // 質問文と番号の更新
            document.getElementById('qText').innerText = currentQuestion.text;
            document.getElementById('qNum').innerText = `Q ${currentIndex + 1}/8`;
            
            // グラフエリアをリセット
            const area = document.getElementById('resultsArea');
            area.innerHTML = ''; 
            
            // 全投票数を計算
            let totalVotes = 0;
            if (currentVotes) {
                Object.values(currentVotes).forEach(v => {
                    totalVotes += (Number(v) || 0);
                });
            }

            // 選択肢とグラフの描画
            if (currentQuestion.options) {
                currentQuestion.options.forEach((opt, i) => {
                    // 票数を安全に取得
                    const voteCount = (currentVotes && currentVotes[i]) ? Number(currentVotes[i]) : 0;
                    
                    // ゲージの長さをパーセンテージで計算（0割りを防ぐ）
                    const percentage = totalVotes > 0 ? Math.round((voteCount / totalVotes) * 100) : 0;

                    area.innerHTML += `
                        <div class="bar-container">
                            <div class="bar-label-area">
                                <span>${opt}</span>
                                <span class="vote-count">${voteCount}票</span>
                            </div>
                            <div class="bar-bg">
                                <div class="bar-fill" style="width: ${percentage}%;"></div>
                            </div>
                        </div>
                    `;
                });
            }
        }

        // サーバーからどんなイベント名で送られてきても画面を更新する
        socket.on('stateUpdate', updateScreen);
        socket.on('voteUpdate', updateScreen);
        socket.on('update', updateScreen);
        socket.on('voted', updateScreen);
        socket.on('newVote', updateScreen);

        document.getElementById('btnStart').onclick = () => { playStartSound(); socket.emit('adminStartVoting'); };
        document.getElementById('btnEnd').onclick = () => { playWhistle(); socket.emit('adminCloseVoting'); };
        document.getElementById('btnDrum').onclick = function() { toggleDrum(this); };
        document.getElementById('btnNext').onclick = () => socket.emit('adminChangeQuestion', 1);
        document.getElementById('btnPrev').onclick = () => socket.emit('adminChangeQuestion', -1);
    </script>
</body>
</html>
