<!DOCTYPE html>
<html lang="ja"><head><meta charset="UTF-8"><title>プレゼンター</title><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script></head>
<body>
<div id="qrcode"></div><h1 id="qText">読み込み中...</h1><div id="res"></div>
<button onclick="socket.emit('adminStartVoting')">開始</button><button onclick="socket.emit('adminCloseVoting')">終了</button>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
new QRCode(document.getElementById("qrcode"), window.location.origin + '/mobile.html');
socket.on('stateUpdate', d => { document.getElementById('qText').innerText = d.question.text; });
</script>
</body></html>
