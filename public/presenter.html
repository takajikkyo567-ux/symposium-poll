<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>シンポジウム - プロジェクター画面</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { background: #0a0a0a; color: #fff; font-family: sans-serif; margin: 0; padding: 20px; text-align: center; }
        .controls { background: #222; padding: 20px; border-radius: 10px; display: inline-block; }
        button { font-size: 1.2em; padding: 12px 24px; margin: 5px; cursor: pointer; border-radius: 8px; font-weight: bold; }
        #qrModal { display: none; position: fixed; top:0; left:0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 999; flex-direction: column; align-items: center; justify-content: center; }
        .qr-box { background: #fff; padding: 40px; border-radius: 20px; color: #000; }
    </style>
</head>
<body>
    <div id="qrModal" onclick="this.style.display='none'"><div class="qr-box"><h2>スマホで参加</h2><div id="qrcode"></div></div></div>
    <div class="controls">
        <button id="btnPrev">◀ 前</button>
        <span id="qNum" style="margin:0 20px;">Q 1/8</span>
        <button id="btnNext">次 ▶</button>
        <button id="btnStart" style="background:#00ffaa">▶ 質問を発出</button>
        <button id="btnDrum" style="background:#aa00ff; color:#fff">🥁 ドラムロール</button>
        <button id="btnEnd" style="background:#ff0055; color:#fff">■ 締め切り（笛）</button>
        <button onclick="document.getElementById('qrModal').style.display='flex'">📱 QR表示</button>
    </div>
    <h1 id="qText" style="color:#ffff00; font-size:3em;">読み込み中...</h1>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        new QRCode(document.getElementById("qrcode"), window.location.origin + '/mobile.html');
        const ctx = new (window.AudioContext || window.webkitAudioContext)();

        // 締め切り笛音（運動会風）
        function playWhistle() {
            [2700, 2750].forEach(f => {
                const o = ctx.createOscillator(); const g = ctx.createGain();
                o.type = 'triangle'; o.frequency.value = f;
                g.gain.setValueAtTime(0, ctx.currentTime);
                g.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.1);
                g.gain.linearRampToValueAtTime(0.3, ctx.currentTime + 0.9);
                g.gain.linearRampToValueAtTime(0, ctx.currentTime + 1.0);
                o.connect(g); g.connect(ctx.destination);
                o.start(); o.stop(ctx.currentTime + 1.0);
            });
        }

        // ドラムロール（ホワイトノイズ＋ピッチ変動）
        let drumInterval = null;
        function toggleDrum(btn) {
            if (!drumInterval) {
                drumInterval = setInterval(() => {
                    const b = ctx.createBuffer(1, ctx.sampleRate * 0.05, ctx.sampleRate);
                    const data = b.getChannelData(0);
                    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
                    const src = ctx.createBufferSource(); src.buffer = b;
                    const filter = ctx.createBiquadFilter(); filter.type = 'bandpass'; filter.frequency.value = 200;
                    src.connect(filter); filter.connect(ctx.destination); src.start();
                }, 50);
                btn.innerText = '🥁 ドラム停止';
            } else {
                clearInterval(drumInterval); drumInterval = null;
                btn.innerText = '🥁 ドラムロール';
            }
        }

        socket.on('stateUpdate', d => {
            document.getElementById('qText').innerText = d.question.text;
            document.getElementById('qNum').innerText = `Q ${d.questionIndex + 1}/8`;
        });
        document.getElementById('btnStart').onclick = () => { socket.emit('adminStartVoting'); };
        document.getElementById('btnEnd').onclick = () => { playWhistle(); socket.emit('adminCloseVoting'); };
        document.getElementById('btnDrum').onclick = function() { toggleDrum(this); };
        document.getElementById('btnNext').onclick = () => socket.emit('adminChangeQuestion', 1);
        document.getElementById('btnPrev').onclick = () => socket.emit('adminChangeQuestion', -1);
    </script>
</body>
</html>
